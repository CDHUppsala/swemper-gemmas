[project]
name = "gemmas"
version = "0.1.0"
description = "Fast on-the-fly semantic code and text search CLI powered by Google EmbeddingGemma-2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Matts Lindström" }
]
keywords = [
    "semantic-search",
    "embeddinggemma",
    "lancedb",
    "cli",
    "code-search",
    "vector-search",
    "digital-humanities",
    "swemper"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "torchvision",
    "numpy>=1.24.0",
    "pillow>=9.0.0",
    "lancedb>=0.40.0",
    "pyarrow>=25.0.1",
]

[project.urls]
Homepage = "https://github.com/mattslindstrom/swemper-gemmas"
Repository = "https://github.com/mattslindstrom/swemper-gemmas"
Issues = "https://github.com/mattslindstrom/swemper-gemmas/issues"

[project.scripts]
gemmas = "gemmas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
