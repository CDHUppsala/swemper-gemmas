[project]
name = "gemmas"
version = "0.1.0"
description = "Fast on-the-fly semantic code and text search CLI powered by Google EmbeddingGemma-2"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "SweMPer Research Team" }
]
dependencies = [
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "torchvision",
    "numpy>=1.24.0",
    "pillow>=9.0.0",
]

[project.scripts]
gemmas = "gemmas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
